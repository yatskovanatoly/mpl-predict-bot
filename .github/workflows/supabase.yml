name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - supabase/functions/**
      - supabase/migrations/**
      - supabase/config.toml
      - .github/workflows/supabase.yml
  workflow_dispatch:

jobs:
  deploy:
    environment: Production – mpl-predict-bot
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref $PROJECT_ID

      - name: Detect changed Supabase resources
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            FUNCTIONS=$(ls supabase/functions | grep -v '^_shared$')
            echo "functions<<EOF" >> "$GITHUB_OUTPUT"
            echo "$FUNCTIONS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" || true)
          DEPLOY_MIGRATIONS=false

          if echo "$FILES" | grep -q '^supabase/migrations/'; then
            DEPLOY_MIGRATIONS=true
          fi

          if echo "$FILES" | grep -q '^.github/workflows/supabase.yml$'; then
            DEPLOY_MIGRATIONS=true
          fi

          if echo "$FILES" | grep -q '^supabase/functions/_shared/'; then
            FUNCTIONS=$(ls supabase/functions | grep -v '^_shared$')
          elif echo "$FILES" | grep -Eq '^supabase/config.toml$|^\.github/workflows/supabase.yml$'; then
            FUNCTIONS=$(ls supabase/functions | grep -v '^_shared$')
          else
            FUNCTIONS=$(echo "$FILES" \
              | grep '^supabase/functions/' \
              | cut -d/ -f3 \
              | sort -u)
          fi

          echo "functions<<EOF" >> $GITHUB_OUTPUT
          echo "$FUNCTIONS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "migrations=$DEPLOY_MIGRATIONS" >> "$GITHUB_OUTPUT"

      - name: Deploy database migrations
        if: steps.changes.outputs.migrations == 'true'
        run: supabase db push --remote --yes

      - name: Deploy changed functions
        if: steps.changes.outputs.functions != ''
        run: |
          functions="${{ steps.changes.outputs.functions }}"
          while IFS= read -r fn; do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --no-verify-jwt --yes
          done <<< "$functions"

