name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - supabase/functions/**
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Detect changed functions
        id: changes
        run: |
          FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || true)

          if echo "$FILES" | grep -q '^supabase/functions/_shared/'; then
            FUNCTIONS=$(ls supabase/functions | grep -v '^_shared$')
          else
            FUNCTIONS=$(echo "$FILES" \
              | grep '^supabase/functions/' \
              | cut -d/ -f3 \
              | sort -u)
          fi

          echo "functions<<EOF" >> $GITHUB_OUTPUT
          echo "$FUNCTIONS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Deploy changed functions
        if: steps.changes.outputs.functions != ''
        run: |
          for fn in ${{ steps.changes.outputs.functions }}; do
            echo "Deploying $fn"
            supabase functions deploy "$fn"
          done
