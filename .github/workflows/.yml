name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - supabase/functions/**
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Auth Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase login --token "$SUPABASE_ACCESS_TOKEN"

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Detect changed functions
        id: changes
        run: |
          CHANGED_FUNCTIONS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep '^supabase/functions/' \
            | cut -d/ -f3 \
            | sort -u)

          echo "Changed functions:"
          echo "$CHANGED_FUNCTIONS"

          echo "functions<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FUNCTIONS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Deploy changed functions
        if: steps.changes.outputs.functions != ''
        run: |
          for fn in ${{ steps.changes.outputs.functions }}; do
            echo "Deploying $fn"
            supabase functions deploy "$fn"
          done
